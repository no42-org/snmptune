# net-snmp config for the integration rig. Started unprivileged on a high
# port by the integration tests; see cmd/snmptune/integration_test.go.

rocommunity public 127.0.0.1
sysLocation snmptune integration rig
sysContact ronny@no42.org
sysServices 72

# A deliberately slow subtree: every OID costs about 100 ms, so the timeout
# suggestion has something to react to.
pass .1.3.6.1.4.1.8072.9999 /bin/sh testdata/slow.sh
