#
# Tag-triggered release: builds the multi-arch binaries, an SBOM, signs the
# checksums with cosign keyless, attests provenance and creates a draft
# GitHub Release with everything attached. The maintainer adds curated
# notes and publishes it (see RELEASING.md).

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Serialize releases and never cancel one: a cancelled run leaves a draft
# with partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/quality-gates.yml

  release:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # cosign keyless and provenance
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Build release archives
        run: make release-build VERSION="$GITHUB_REF_NAME"
      # The SBOM must exist before checksums are computed, or it ships unverifiable.
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums and signature
        run: |
          cd dist
          find . -type f | sort | xargs sha256sum > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cosign sign-blob --yes --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "Release notes pending." $PRE
          find dist -type f -exec gh release upload "$GITHUB_REF_NAME" --clobber {} +
